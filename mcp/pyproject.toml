[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-monitoring-mcp-central"
version = "0.1.0"
description = "MCP central minimo para validacao de alertas do MySQL Conf"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["agent-monitoring", 
  "jsonschema[format]>=4.23,<5",
  "mcp>=1.30,<2",
  "agent-monitoring-dba-audit-security-alerts>=0.1.0",
  "agent-monitoring-dba-health-check-alerts>=0.1.0",
  "agent-monitoring-notification>=0.1.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.13,<1",
]

[project.scripts]
agent-monitoring-mcp = "mysqlconf_mcp.server:main"
mysqlconf-mcp = "mysqlconf_mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mysqlconf_mcp = ["contracts/*.json"]

[tool.uv.sources]
agent-monitoring = { path = "..", editable = true }
agent-monitoring-dba-audit-security-alerts = { path = "../agents/dba/audit-security-alerts", editable = true }
agent-monitoring-dba-health-check-alerts = { path = "../agents/dba/health-check-alerts", editable = true }
agent-monitoring-notification = { path = "../agents/notification", editable = true }

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

