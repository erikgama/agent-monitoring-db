[project]
name = "agent-monitoring-lab-console"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["agent-monitoring", "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1", "websockets>=15,<17", "psutil>=7,<8", "pydantic>=2.10,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.12,<1", "mypy>=1.15,<2", "types-psutil"]

[project.scripts]
lab-runner = "labconsole.runner:main"
lab-password = "labconsole.security:password_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["labconsole"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: exercises real local HTTP, WebSocket or subprocess lifecycle",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "../../.."
check_untyped_defs = true
files = ["labconsole"]

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[tool.uv.sources]
agent-monitoring = { path = "../../..", editable = true }
