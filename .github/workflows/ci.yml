name: Verify installation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.0
      - uses: actions/setup-node@v6.0.0
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.22'
      - name: Install from lockfiles
        run: python3 scripts/bootstrap.py
      - name: Tests and web build without database, SMTP or LLM
        run: python3 scripts/check.py
      - name: Install Chromium for demo browser checks
        working-directory: apps/lab-console/web
        run: npx playwright install --with-deps chromium
      - name: Browser verification in isolated demo
        run: python3 scripts/e2e.py
