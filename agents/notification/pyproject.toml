[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-monitoring-notification"
version = "0.1.0"
description = "Entrega segura de alertas validados do MySQL Conf por e-mail"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["agent-monitoring", 
  "jsonschema[format]>=4.23,<5",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.13,<1",
]

[project.scripts]
mysql-notification-email-test = "notification.demo:main"
notification-email-test = "notification.demo:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["notification*"]

[tool.setuptools.package-data]
notification = [
  "templates/*.html",
  "advisor/*.md",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.uv.sources]
agent-monitoring = { path = "../..", editable = true }
