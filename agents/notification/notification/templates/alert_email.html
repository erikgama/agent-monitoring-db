<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>$source_label - $title</title>
  </head>
  <body bgcolor="#f3f4f6" style="background:#f3f4f6;margin:0;padding:0;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#f3f4f6" style="background:#f3f4f6;border-collapse:collapse;width:100%;">
      <tr>
        <td align="center" style="padding:24px 12px;">
          <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" bgcolor="#ffffff" style="background:#ffffff;border:1px solid #e5e7eb;border-collapse:separate;color:#111827;font-family:Arial,Helvetica,sans-serif;max-width:600px;width:100%;">
            <tr>
              <td bgcolor="$severity_background" style="background:$severity_background;border-top:5px solid $severity_border;padding:22px 24px;">
                <div style="color:$severity_color;font-size:12px;font-weight:700;letter-spacing:.8px;line-height:18px;">$severity · $source_label</div>
                <div style="color:#111827;font-size:22px;font-weight:700;line-height:29px;padding-top:7px;">$title</div>
              </td>
            </tr>
            <tr>
              <td style="padding:24px;">
          <p style="color:#374151;font-size:15px;line-height:1.55;margin:0 0 20px;">$summary</p>

          <table role="presentation" style="border-collapse:collapse;width:100%;">
            <tr>
              <td style="border-top:1px solid #e5e7eb;color:#6b7280;font-size:12px;padding:10px 8px 10px 0;width:100px;">Ambiente</td>
              <td style="border-top:1px solid #e5e7eb;color:#111827;font-size:13px;font-weight:600;padding:10px 0;">$environment</td>
            </tr>
            <tr>
              <td style="border-top:1px solid #e5e7eb;color:#6b7280;font-size:12px;padding:10px 8px 10px 0;">Categoria</td>
              <td style="border-top:1px solid #e5e7eb;color:#111827;font-size:13px;padding:10px 0;">$category_label</td>
            </tr>
            <tr>
              <td style="border-bottom:1px solid #e5e7eb;border-top:1px solid #e5e7eb;color:#6b7280;font-size:12px;padding:10px 8px 10px 0;">Detectado em</td>
              <td style="border-bottom:1px solid #e5e7eb;border-top:1px solid #e5e7eb;color:#111827;font-size:13px;padding:10px 0;">$detected_at</td>
            </tr>
          </table>

          <h2 style="color:#111827;font-size:16px;margin:24px 0 12px;">Evidência principal</h2>
          $findings_html

                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#f9fafb" style="background:#f9fafb;border-collapse:collapse;margin-top:18px;width:100%;">
                  <tr>
                    <td style="color:#4b5563;font-size:12px;line-height:19px;padding:12px 14px;">$closing_note</td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td bgcolor="#f9fafb" style="background:#f9fafb;border-top:1px solid #e5e7eb;color:#9ca3af;font-size:11px;line-height:17px;padding:12px 24px;">Referência: $alert_id</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
