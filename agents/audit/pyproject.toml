[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-monitoring-audit-security"
version = "0.1.0"
description = "Read-only MySQL HeatWave Enterprise Audit security snapshot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["agent-monitoring", 
  "jsonschema>=4.26,<5",
  "mcp>=1.30,<2",
]

[project.scripts]
mysql-audit-security = "audit_security.main:main"
mysql-audit-advisor = "audit_security.advisor.agent:main"

[project.optional-dependencies]
dev = ["ruff>=0.13,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["audit_security*"]

[tool.setuptools.package-data]
audit_security = ["advisor/*.json", "advisor/*.md", "sql/*.sql", "sql/security_snapshot/*.sql"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["outputs", "reference"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]

[tool.uv.sources]
agent-monitoring = { path = "../..", editable = true }
