[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-monitoring-dba-audit-security-alerts"
version = "0.1.0"
description = "Private DBA inbox for sanitized Audit Security event summaries"
requires-python = ">=3.11"
dependencies = ["agent-monitoring"]

[project.optional-dependencies]
dev = ["ruff>=0.13,<1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.uv.sources]
agent-monitoring = { path = "../../..", editable = true }
