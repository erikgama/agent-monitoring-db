[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-monitoring-refactor"
version = "0.1.0"
description = "Validação read-only de refatorações SQL versionadas para o DBA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["agent-monitoring", 
  "jsonschema>=4.26,<5",
  "mcp>=1.30,<2",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.13,<1",
]

[project.scripts]
mysql-refactor-advisor = "query_refactor.advisor.agent:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["query_refactor*"]

[tool.setuptools.package-data]
query_refactor = ["advisor/*.md"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]

[tool.uv.sources]
agent-monitoring = { path = "../..", editable = true }
