[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-monitoring"
version = "0.1.0"
description = "Portable configuration and LLM adapters for MySQL monitoring agents"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.26,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.13,<1", "mcp>=1.30,<2"]

[project.scripts]
agent-monitoring = "agent_monitoring.cli:main"

[tool.setuptools.packages.find]
include = ["agent_monitoring*"]

[tool.setuptools.package-data]
agent_monitoring = ["*.md", "py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
